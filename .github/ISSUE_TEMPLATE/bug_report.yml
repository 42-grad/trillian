name: Bug report
description: Report incorrect behaviour, a crash, or a wrong query result
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security vulnerabilities, do **not** use this
        form — see [SECURITY.md](../blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal SPARQL query and (small) dataset that triggers the issue.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD` or the release version.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Rust version, dataset size — anything relevant.
    validations:
      required: false
