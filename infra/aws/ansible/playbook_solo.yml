---
# Solo benchmark: provision a host, build the engine, run wdbench_solo.sh
# and compare against the published WDBench numbers.
- name: Provision AWS host, build the Rust engine, run the solo WDBench benchmark
  hosts: wdbench
  become: yes
  vars:
    project_dir: /opt/trillian
    wdbench_stride: 1    # 1 = full 1.257B-triple graph
    wdbench_timeout: 60  # seconds per query (matches the reference)
  pre_tasks:
    - name: Ensure project directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'
  roles:
    - common   # apt deps + Rust toolchain
    - bench     # local: sync the project, build the server, run wdbench_solo.sh
