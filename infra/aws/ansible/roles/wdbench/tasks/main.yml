---
- name: Ensure project directory exists
  file:
    path: "{{ project_dir }}"
    state: directory
    mode: '0755'

- name: Copy project to host (inkl. wdbench_*.sh / *.py)
  synchronize:
    src: "{{ playbook_dir }}/../../../"   # Repo-Wurzel (infra/aws/ansible -> ../../../)
    dest: "{{ project_dir }}"
    delete: yes
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=target"
      - "--exclude=third_party"
      - "--exclude=*.nt"
      - "--exclude=*.bin"
      - "--exclude=wdbench_data"
      - "--exclude=infra"

- name: Build the Rust server binary (release)
  shell: |
    . $HOME/.cargo/env
    cargo build --release --bin server
  args:
    chdir: "{{ project_dir }}"
  environment:
    PATH: "{{ ansible_env.PATH }}:/root/.cargo/bin"

- name: Run WDBench duel (download + build both engines + compare)
  shell: |
    . $HOME/.cargo/env
    ./wdbench_duel.sh {{ wdbench_stride }} {{ wdbench_maxq }}
  args:
    chdir: "{{ project_dir }}"
    executable: /bin/bash
  environment:
    PATH: "{{ ansible_env.PATH }}:/root/.cargo/bin:/root/.local/bin"
  register: wdbench_output
  timeout: 28800    # bis zu 8 h: Download+Decompress, Ingest 1,26 Mrd. je Engine
  ignore_errors: yes

- name: Save WDBench duel output to log file
  copy:
    content: "{{ wdbench_output.stdout | default('') }}\n\n=== STDERR ===\n{{ wdbench_output.stderr | default('') }}"
    dest: "{{ project_dir }}/wdbench_duel.log"
    mode: '0644'
