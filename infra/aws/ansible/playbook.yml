---
- name: Provision AWS host, build Rust clone + Tentris, run the WDBench duel
  hosts: wdbench
  become: yes
  vars:
    project_dir: /opt/tentris_clone
    # Überschreibbar via `-e` aus run_aws_duel.sh:
    wdbench_stride: 1     # 1 = voller Datensatz (1,26 Mrd. Tripel)
    wdbench_maxq: 100     # Queries je Kategorie für den Vergleich
  pre_tasks:
    - name: Ensure project directory exists (vor dem Tentris-Clone)
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'
  roles:
    - common      # geteilt: apt-Deps, Rust, Conan, JDK, cmake
    - tentris     # geteilt: Tentris klonen + bauen
    - wdbench     # lokal: Projekt syncen, server bauen, wdbench_duel.sh fahren
