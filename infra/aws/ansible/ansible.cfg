[defaults]
# Lokale wdbench-Rolle zuerst, dann die geteilten Rollen des Hetzner-Setups.
roles_path = roles:../../ansible/roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Lange, leise Tasks (Decompress/Ingest, minutenlang ohne Output) dürfen die
# SSH-Verbindung nicht idle-trennen -> Keepalive + persistenter Control-Socket.
# ServerAliveInterval 30s × CountMax 240 ≈ 2h Toleranz.
ssh_args = -o ControlMaster=auto -o ControlPersist=900s -o ServerAliveInterval=30 -o ServerAliveCountMax=240 -o TCPKeepAlive=yes
