[defaults]
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Long, quiet tasks (decompress/ingest, minutes without output) must not let the
# SSH connection drop on idle -> keepalive + persistent control socket.
# ServerAliveInterval 30s × CountMax 240 ≈ 2h tolerance.
ssh_args = -o ControlMaster=auto -o ControlPersist=900s -o ServerAliveInterval=30 -o ServerAliveCountMax=240 -o TCPKeepAlive=yes
