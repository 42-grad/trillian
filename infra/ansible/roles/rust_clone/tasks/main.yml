---
- name: Ensure project directory exists
  file:
    path: "{{ project_dir }}"
    state: directory
    mode: '0755'

- name: Copy Rust project to server
  synchronize:
    src: "{{ playbook_dir }}/../../"
    dest: "{{ project_dir }}"
    delete: yes
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=target"
      - "--exclude=third_party"
      - "--exclude=*.nt"
      - "--exclude=chain_query.sparql"
      - "--exclude=triangle_query.sparql"
      - "--exclude=duel_output.log"
      - "--exclude=infra"

- name: Build Rust clone in release mode
  shell: |
    . $HOME/.cargo/env
    cargo build --release --bin tentris_clone
  args:
    chdir: "{{ project_dir }}"
  environment:
    PATH: "{{ ansible_env.PATH }}:/root/.cargo/bin"

- name: Generate synthetic_1m.nt
  shell: |
    . $HOME/.cargo/env
    cargo run --release --bin tentris_clone
  args:
    chdir: "{{ project_dir }}"
  environment:
    PATH: "{{ ansible_env.PATH }}:/root/.cargo/bin"
