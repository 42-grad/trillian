[package]
name = "tentris_clone"
version = "0.1.0"
edition = "2024"

[dependencies]
rustc-hash = "2"
rand = "0.8"
rayon = "1.10"
roaring = "0.10"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spargebra = "0.4"
lru = "0.13"
tokio-stream = "0.1"
memmap2 = "0.9"
bytemuck = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
