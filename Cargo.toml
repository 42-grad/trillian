[package]
name = "trillian"
version = "0.1.2"
edition = "2024"
rust-version = "1.87"
# Not published to crates.io yet; flip to allow `cargo publish` when ready.
publish = false
license = "Apache-2.0"
description = "A lean Rust RDF triple store and SPARQL engine (flat-CSR permutation indexes, WCOJ, property paths)."
repository = "https://github.com/42-grad/trillian"
authors = ["42grad GmbH <info@42-grad.com>"]
readme = "README.md"
keywords = ["rdf", "sparql", "triplestore", "database", "wcoj"]
categories = ["database-implementations"]

[dependencies]
rustc-hash = "2"
rand = "0.9"
rayon = "1.10"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spargebra = "0.4"
lru = "0.13"
tokio-stream = "0.1"
memmap2 = "0.9"
bytemuck = "1"
string-interner = "0.17"
dhat = { version = "0.3", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
dhat = ["dep:dhat"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
